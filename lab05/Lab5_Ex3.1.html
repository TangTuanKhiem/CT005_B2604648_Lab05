<!DOCTYPE html>
<html lang="vi">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Infographic và video – Nhiệm vụ 2.2</title>
	<style>
		* { box-sizing: border-box; }
		body { margin: 0; padding: 32px 18px; background: #f2f6fa; color: #203448; font-family: Arial, sans-serif; line-height: 1.6; }
		main { max-width: 960px; margin: auto; padding: clamp(20px, 5vw, 44px); background: #fff; border-radius: 16px; box-shadow: 0 8px 28px #20344818; }
		header { text-align: center; margin-bottom: 28px; }
		h1 { margin: 0 0 8px; color: #126b78; font-size: clamp(1.8rem, 4vw, 2.5rem); }
		header p { margin: auto; max-width: 680px; color: #526678; }
		h2 { margin: 30px 0 14px; font-size: 1.3rem; }
		.infographic { display: block; width: 100%; height: auto; border-radius: 10px; }
		.video { position: relative; width: 100%; aspect-ratio: 16 / 9; overflow: hidden; border-radius: 10px; background: #172c3d; }
		.video iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
		footer { margin-top: 30px; padding-top: 16px; border-top: 1px solid #dce5eb; color: #647687; font-size: .9rem; text-align: center; }
	</style>
</head>
<body>
	<main>
		<header>
			<h1>Infographic – Nhiệm vụ 2.2</h1>
			<p>Infographic dưới đây tóm tắt nội dung bài tập; video YouTube cung cấp phần trình bày liên quan đến Nhiệm vụ 2.2.</p>
		</header>

		<section aria-labelledby="infographic-heading">
			<h2 id="infographic-heading">Infographic bài tập</h2>
			<img class="infographic" src="Lab05_Ex2.1.png" alt="Infographic Lab 05, bài tập Nhiệm vụ 2.2">
		</section>

		<section aria-labelledby="video-heading">
			<h2 id="video-heading">Video YouTube – Nhiệm vụ 2.2</h2>
			<div class="video">
				<iframe src="https://www.youtube.com/embed/3nFaO9fk1x8?rel=0&modestbranding=1"
					title="Video YouTube cho Nhiệm vụ 2.2"
					allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
					referrerpolicy="strict-origin-when-cross-origin"
					allowfullscreen>
				</iframe>
			</div>
		</section>

		<footer>© 2025 – Bài thực hành Lab 05. Hình ảnh và video thuộc quyền sở hữu của các chủ sở hữu tương ứng.</footer>
	</main>
</body>
</html>
